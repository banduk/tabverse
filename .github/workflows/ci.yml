name: CI

on:
  push:
    branches: [main, 'privacy/**', 'feature/**']
  pull_request:
    branches: [main, 'privacy/**', 'feature/**']
  workflow_dispatch:

jobs:
  # ---- Chrome extension: format, lint, test, production bundle ----
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup picks the version up from packageManager in
      # package.json, so the lockfile and CI cannot drift apart
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # TypeScript 6 / Vite 8 want a recent node; 22 is the active LTS
          node-version: 22
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm run typecheck

      - name: format check
        run: pnpm run format:check

      - name: lint
        run: pnpm run lint:check

      - name: unit tests
        run: pnpm test

      - name: production build
        run: pnpm run build

      - name: assert private network policy
        run: node tools/check-private-build.mjs

      - name: archive production bundle
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist/
          retention-days: 7

  # ---- store package: zip that can be uploaded to the web store ----
  package:
    runs-on: ubuntu-latest
    needs: [extension]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: build store zip
        # produces dist_store/tabverse.zip; the web store takes the zip, and a
        # hand install extracts it and uses "Load unpacked". No .crx: modern
        # Chrome blocks installing an off-store .crx.
        run: pnpm run build-store

      - name: archive store package
        uses: actions/upload-artifact@v4
        with:
          name: tabverse-store-zip
          path: dist_store/tabverse.zip
          retention-days: 14
