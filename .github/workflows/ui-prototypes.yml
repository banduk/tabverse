name: UI prototype screenshots

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/ui-redesign/**'
      - 'tools/render-ui-proposals.py'
      - '.github/workflows/ui-prototypes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium renderer
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Render four offline previews
        run: python tools/render-ui-proposals.py
      - name: Archive screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tabverse-chrome-native-ui-options
          path: ui-prototype-screenshots/*.png
          retention-days: 21
